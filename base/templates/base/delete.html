{% extends 'main.html' %}

{% block content %}

<div style="max-width: 600px; margin: 60px auto;">

    <h2>Are you sure you want to delete this message?</h2>

    <p style="margin: 20px 0;">
        "{{ message.body }}"
    </p>

    <form method="POST">
        {% csrf_token %}

        <button type="submit">
            Confirm Delete
        </button>

        <a href="{% url 'room' message.room.id %}">
            Cancel
        </a>
    </form>

</div>

{% endblock content %}
