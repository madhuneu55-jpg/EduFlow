{% extends 'main.html' %}

{% block content %}

<style>

    /* =====================================
       LOGIN PAGE
    ===================================== */

    .login-page {
        min-height: calc(100vh - 70px);

        display: flex;
        align-items: center;
        justify-content: center;

        padding: 50px 20px;

        background:
            radial-gradient(
                circle at top left,
                rgba(99, 102, 241, 0.08),
                transparent 35%
            ),
            radial-gradient(
                circle at bottom right,
                rgba(79, 70, 229, 0.06),
                transparent 35%
            );
    }


    /* =====================================
       CARD
    ===================================== */

    .login-card {
        width: 100%;
        max-width: 430px;

        background: #ffffff;

        padding: 38px;

        border: 1px solid #e5e7eb;

        border-radius: 20px;

        box-shadow:
            0 20px 50px rgba(15, 23, 42, 0.08);

        animation: loginCard 0.4s ease;
    }


    @keyframes loginCard {

        from {
            opacity: 0;
            transform: translateY(12px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }

    }


    /* =====================================
       HEADER
    ===================================== */

    .login-header {
        text-align: center;

        margin-bottom: 30px;
    }


    .login-logo {
        width: 58px;
        height: 58px;

        margin: 0 auto 17px;

        display: flex;
        align-items: center;
        justify-content: center;

        background: linear-gradient(
            135deg,
            #6366f1,
            #4f46e5
        );

        color: #ffffff;

        border-radius: 15px;

        font-size: 25px;

        font-weight: 800;

        box-shadow:
            0 10px 22px rgba(79, 70, 229, 0.25);
    }


    .login-header h1 {
        margin: 0;

        color: #111827;

        font-size: 29px;

        line-height: 1.2;

        font-weight: 750;

        letter-spacing: -0.5px;
    }


    .login-header p {
        margin: 9px 0 0;

        color: #64748b;

        font-size: 14px;

        line-height: 1.5;
    }


    /* =====================================
       DJANGO MESSAGE
    ===================================== */

    .login-message {
        display: flex;
        align-items: center;

        gap: 9px;

        margin-bottom: 20px;

        padding: 11px 13px;

        background: #fef2f2;

        color: #dc2626;

        border: 1px solid #fecaca;

        border-radius: 10px;

        font-size: 13px;

        line-height: 1.4;
    }


    .login-message::before {
        content: "!";
        
        width: 20px;
        height: 20px;

        flex-shrink: 0;

        display: flex;
        align-items: center;
        justify-content: center;

        border-radius: 50%;

        background: #fee2e2;

        color: #dc2626;

        font-size: 12px;

        font-weight: 700;
    }


    /* =====================================
       FORM
    ===================================== */

    .login-form {
        display: flex;

        flex-direction: column;

        gap: 18px;
    }


    .form-group {
        display: flex;

        flex-direction: column;

        gap: 7px;
    }


    .form-group label {
        color: #334155;

        font-size: 13px;

        font-weight: 650;
    }


    .input-wrapper {
        position: relative;
    }


    .input-icon {
        position: absolute;

        left: 14px;

        top: 50%;

        transform: translateY(-50%);

        color: #94a3b8;

        font-size: 15px;

        pointer-events: none;
    }


    .form-group input {
        width: 100%;

        height: 46px;

        padding: 0 14px 0 40px;

        border: 1px solid #dbe0e8;

        border-radius: 10px;

        outline: none;

        background: #f8fafc;

        color: #111827;

        font-size: 14px;

        transition:
            border-color 0.2s ease,
            background 0.2s ease,
            box-shadow 0.2s ease;
    }


    .form-group input:hover {
        border-color: #cbd5e1;

        background: #ffffff;
    }


    .form-group input:focus {
        background: #ffffff;

        border-color: #6366f1;

        box-shadow:
            0 0 0 3px rgba(99, 102, 241, 0.10);
    }


    .form-group input::placeholder {
        color: #94a3b8;
    }


    /* =====================================
       LOGIN BUTTON
    ===================================== */

    .login-submit {
        width: 100%;

        height: 46px;

        margin-top: 3px;

        border: none;

        border-radius: 10px;

        background: linear-gradient(
            135deg,
            #6366f1,
            #4f46e5
        );

        color: #ffffff;

        font-size: 14px;

        font-weight: 650;

        cursor: pointer;

        box-shadow:
            0 7px 16px rgba(79, 70, 229, 0.20);

        transition:
            transform 0.2s ease,
            box-shadow 0.2s ease,
            filter 0.2s ease;
    }


    .login-submit:hover {
        transform: translateY(-1px);

        filter: brightness(0.97);

        box-shadow:
            0 10px 22px rgba(79, 70, 229, 0.27);
    }


    .login-submit:active {
        transform: translateY(0);
    }


    /* =====================================
       DIVIDER
    ===================================== */

    .login-divider {
        display: flex;

        align-items: center;

        gap: 12px;

        margin: 24px 0 20px;

        color: #94a3b8;

        font-size: 11px;

        text-transform: uppercase;

        letter-spacing: 0.7px;
    }


    .login-divider::before,
    .login-divider::after {
        content: "";

        flex: 1;

        height: 1px;

        background: #e5e7eb;
    }


    /* =====================================
       FOOTER
    ===================================== */

    .login-footer {
        text-align: center;

        color: #64748b;

        font-size: 13px;

        line-height: 1.5;
    }


    .login-footer a {
        color: #4f46e5;

        text-decoration: none;

        font-weight: 650;

        transition: 0.2s;
    }


    .login-footer a:hover {
        color: #4338ca;

        text-decoration: underline;
    }


    /* =====================================
       MOBILE
    ===================================== */

    @media (max-width: 500px) {

        .login-page {
            min-height: calc(100vh - 60px);

            padding: 30px 15px;
        }


        .login-card {
            padding: 30px 22px;

            border-radius: 16px;
        }


        .login-header h1 {
            font-size: 26px;
        }

    }

</style>


<div class="login-page">


    <div class="login-card">


        <!-- =================================
             HEADER
        ================================= -->

        <div class="login-header">

            <div class="login-logo">
                E
            </div>

            <h1>
                Welcome back
            </h1>

            <p>
                Sign in to continue learning with EduFlow.
            </p>

        </div>



        <!-- =================================
             DJANGO MESSAGES
        ================================= -->

        {% if messages %}

            {% for message in messages %}

                <div class="login-message">

                    {{ message }}

                </div>

            {% endfor %}

        {% endif %}



        <!-- =================================
             LOGIN FORM
        ================================= -->

        <form
            method="POST"
            class="login-form"
        >

            {% csrf_token %}


            <!-- USERNAME -->

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <div class="input-wrapper">

                    <span class="input-icon">
                        
                    </span>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        autocomplete="username"
                        required
                    >

                </div>

            </div>



            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <div class="input-wrapper">

                    <span class="input-icon">
                        
                    </span>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>

            </div>



            <!-- SUBMIT -->

            <button
                type="submit"
                class="login-submit"
            >

                Sign In

            </button>

        </form>



        <!-- =================================
             DIVIDER
        ================================= -->

        <div class="login-divider">
            Account
        </div>



        <!-- =================================
             REGISTER
        ================================= -->

        <div class="login-footer">

            Don't have an account?

            <a href="{% url 'register' %}">
                Create an account
            </a>

        </div>


    </div>

</div>


{% endblock content %}
